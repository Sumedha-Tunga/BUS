<!DOCTYPE html>
<html>
  <head>
    <title>UGA BUS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/BUS-nobckg.png">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-image: url('BUS.jpg');
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        background-position: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        min-height: 100vh;
      }

      h1 {
        text-align: center;
        color: #ffffff;
        font-size: clamp(24px, 8vw, 48px);
        background-color: black;
        padding: 10px;
      }

      h2 {
        text-align: center;
        color: #ffffff;
        font-size: clamp(8px, 5vw, 16px);
        background-color: black;
        padding: 15px;
      }

      h3 {
        text-align: left;
        color: #ffffff;
        font-size: clamp(18px, 4vw, 24px);
        margin-top: 15px;
      }
      
      .p {
        text-align: left;
        color: #ffffff;
        font-size: clamp(14px, 3.5vw, 20px);
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 240px;
        padding: 20px 5px;
        width: 100%;          
        max-width: none;      
        margin: 0 auto;
      }

      .button {
        background-color: #BA0C2F;
        cursor: pointer;
        padding: 30px;
        font-size: clamp(16px, 4vw, 24px);
        border: none;
        border-radius: 5px;
        color: white;
        transition: background-color 0.3s;
      }

      .button:hover {
        background-color: #000000;
      }

      .button a {
        text-decoration: none;
        color: white;
        display: block;
      }

      .sidebar {
        background-color: black;
        padding: 20px 40px;
        border-radius: 5px;
      }

      ul {
        list-style-position: inside;
        margin-left: 10px;
      }

      ul li {
        margin-bottom: 10px;
      }

      a:link {
        color: #FFFFFF;
        background-color: transparent;
      }
      a:visited {
        color: #C8D8EB;
        background-color: transparent;
      }
      a:hover {
        color: #C8D8EB;
        background-color: transparent;
        text-decoration: none;
      }
      a:active {
        color: #FFFFFF;
        background-color: transparent;
        text-decoration: none;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          gap: 40px;
          padding: 15px;
        }

        .button {
          padding: 20px;
          width: 100%;
        }

        .sidebar {
          width: 100%;
        }
      }
      
       @media (min-width: 650px) {
        .container {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 200px;              
          padding: 20px 0;
          justify-content: center;
        }
      
        .button,
        .sidebar {
          flex: 1 1 300px;        
          max-width: 350px;       
        }
      }
    </style>
  </head>
    
  <body>
    <div style="background-color:black;">
      <h1><b>Turning Anecdotes Into Heuristics</b> <br> <i>Figuring Out The UGA Bus System</i></h1>
      <h2>How do UGA students, staff, and faculty experience the University of Georgia's bus system, and where/how can we improve it?</h2>
    </div>

    <div class="container">
      <div class="sidebar">
        <h3>Survey Results</h3>
          <p class="p">
            Work In Progress! Check back later!  
          </p>  
    </div>    
  </body>
</html>
